name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run tests (keyboard output is suppressed)
        run: swift test
      - name: Compile app and helper
        run: |
          swift build -c release --product ErgoControl
          swift build -c release --product ErgoInputHelper
      - name: Check build scripts and Python syntax
        run: |
          for script in tools/*.sh; do zsh -n "$script"; done
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for path in Path("tools").glob("*.py"):
              ast.parse(path.read_text(), filename=str(path))
          PY
