name: Build release DMG (self-signed)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.7.8
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      ERGO_UNIVERSAL: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Check tag and version
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = Path('VERSION').read_text().strip()
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or tag != 'v' + version:
              raise SystemExit('The existing vX.Y.Z tag must match VERSION.')
          PY
      - name: Test
        run: swift test
      - name: Import persistent signing certificate
        env:
          SIGNING_CERTIFICATE_P12_B64: ${{ secrets.SIGNING_CERTIFICATE_P12_B64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
        run: python3 tools/release_signing.py install
      - name: Build universal app and bundled helper
        run: zsh tools/build_app.sh
      - name: Package and verify disk image
        run: zsh tools/build_dmg.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes_file="docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes_file" ]; then notes_file="docs/RELEASE_NOTES.md"; fi
          gh release create "$RELEASE_TAG" dist/*.dmg dist/*.sha256 \
            --verify-tag --draft --title "Ergo Control $RELEASE_TAG (self-signed)" \
            --notes-file "$notes_file"
      - name: Remove signing credentials
        if: always()
        run: python3 tools/release_signing.py cleanup
